name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Lint, types, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - name: Unit, integration and agent tests with coverage thresholds
        run: npm run test:coverage
      # Fails on any high or critical advisory in runtime dependencies.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  preview:
    name: Deployed preview — accessibility, security headers and lessons
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the preview and test it under vercel.json's headers
        run: npm run test:preview
